openapi: 3.0.3
info:
  title: 콘서트 예약 서비스 API (Concert Reservation Service)
  description: 콘서트 예약, 좌석 점유, 대기열, 포인트 관리 및 결제를 지원하는 API 명세서입니다.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

paths:
  # 1. 특정 콘서트의 회차(일정) 목록 조회
  /concerts/{concertId}/schedules:
    get:
      summary: 예약 가능 날짜(회차) 조회
      description: 특정 콘서트의 예약 가능한 일정 및 회차 목록을 조회합니다.
      parameters:
        - name: concertId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 고유 ID
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          schedules:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScheduleInfo'

  # 2. 특정 회차의 좌석 조회 (concertId/date 조합 대신 scheduleId 단일 식별자 사용)
  /schedules/{scheduleId}/seats:
    get:
      summary: 특정 회차 좌석 조회
      description: 특정 콘서트 회차(Schedule)의 좌석 예약 현황을 조회합니다. (대기열 통과자 전용)
      security:
        - QueueTokenAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 스케줄(회차) 고유 ID
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          schedule_id:
                            type: string
                            example: "schedule_456"
                          seats:
                            type: array
                            items:
                              $ref: '#/components/schemas/SeatInfo'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # 3. 좌석 임시 배정 요청 (scheduleId 구조 반영 및 전용 헤더 인증 적용)
  /schedules/{scheduleId}/reservations:
    post:
      summary: 좌석 임시 배정 요청
      description: 특정 회차의 좌석을 5분간 임시 점유(HELD)합니다. (대기열 토큰 필수)
      security:
        - QueueTokenAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 스케줄(회차) 고유 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - seat_id
              properties:
                user_id:
                  type: string
                  example: "user_123"
                seat_id:
                  type: string
                  example: "seat_10"
      responses:
        '201':
          description: 임시 배정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reservation_id:
                            type: string
                            example: "reservation_7654"
                          status:
                            type: string
                            example: "HELD"
                          schedule_id:
                            type: string
                            example: "schedule_456"
                          seat_id:
                            type: string
                            example: "seat_10"
                          hold_expire_time:
                            type: string
                            format: date-time
                            example: "2026-12-01T09:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  # 4-1, 4-2. 포인트 조회 및 충전
  /users/{userId}/points:
    get:
      summary: 포인트 조회
      description: 사용자의 현재 포인트 잔액을 조회합니다.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          points:
                            type: integer
                            example: 130000
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: 포인트 충전
      description: 사용자의 지갑에 포인트를 충전합니다.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                  example: 100000
      responses:
        '200':
          description: 충전 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          charged_amount:
                            type: integer
                            example: 100000
                          total_points:
                            type: integer
                            example: 130000
        '400':
          $ref: '#/components/responses/BadRequestError'

  # 5. 결제 요청
  /reservations/{reservationId}/payments:
    post:
      summary: 결제 요청
      description: 임시 배정된 좌석에 대한 결제를 진행하고 예약을 확정합니다. (대기열 토큰 필수)
      security:
        - QueueTokenAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  example: 90000
      responses:
        '201':
          description: 결제 성공 (예약 확정)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment_id:
                            type: string
                            example: "payment_1234"
                          amount:
                            type: integer
                            example: 90000
                          status:
                            type: string
                            example: "CONFIRMED"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '410':
          $ref: '#/components/responses/GoneError'

  # 6-1, 6-2. 대기열 토큰 발급 및 대기번호 조회
  /queues:
    post:
      summary: 대기열 토큰 발급
      description: 대기열 진입을 위한 고유 토큰을 발급받습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  example: "user_123"
      responses:
        '201':
          description: 발급 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QueueStatus'
        '409':
          $ref: '#/components/responses/ConflictError'

  /queues/{userId}:
    get:
      summary: 대기번호 조회
      description: 사용자의 현재 대기열 순번 및 상태를 확인합니다.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QueueStatus'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  # 인증 방식 정의 (대기열 통과 검증용 헤더 스펙 명시)
  securitySchemes:
    QueueTokenAuth:
      type: apiKey
      in: header
      name: Queue-Token
      description: 대기열 진입 시 발급받은 UUID 형태의 토큰 문자열입니다.

  # 데이터 공통 규격 정의
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "에러 상세 메시지 설명"

    # 스케줄 정보 객체
    ScheduleInfo:
      type: object
      properties:
        schedule_id:
          type: string
          example: "schedule_456"
        date:
          type: string
          format: date-time
          example: "2026-12-22T19:30:00Z"
        reservation_open_time:
          type: string
          format: date-time
          example: "2026-12-01T09:00:00Z"
        reservation_close_time:
          type: string
          format: date-time
          example: "2026-12-22T18:00:00Z"

    # 좌석 정보 객체 (ERD 매핑에 맞춰 식별자 구조 동기화)
    SeatInfo:
      type: object
      properties:
        seat_id:
          type: string
          example: "seat_1"
        seat_no:
          type: integer
          example: 1
        status:
          type: string
          enum: [available, held, sold]
          example: "available"

    # 대기열 정보 객체
    QueueStatus:
      type: object
      properties:
        user_id:
          type: string
          example: "user_123"
        token:
          type: string
          example: "abc1234-uuid-token-string"
        status:
          type: string
          enum: [WAIT, ACTIVE]
          example: "WAIT"
        waiting_order:
          type: integer
          example: 33

  responses:
    BadRequestError:
      description: 잘못된 요청 파라미터 또는 충전/결제 유효성 검사 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: 리소스 충돌 (이미 선점된 좌석 또는 이미 대기열에 진입한 상태)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GoneError:
      description: 예약 만료 등 리소스가 유효하지 않게 된 상태
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'