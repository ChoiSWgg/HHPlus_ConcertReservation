openapi: 3.0.3
info:
  title: 콘서트 예약 서비스 API (Concert Reservation Service)
  description: 콘서트 예약, 좌석 점유, 대기열, 포인트 관리 및 결제를 지원하는 API 명세서입니다.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

paths:
  # 1. 예약 가능 날짜 조회
  /concerts/{concertId}/dates:
    get:
      summary: 예약 가능 날짜 조회
      description: 특정 콘서트의 예약 가능한 날짜 목록을 조회합니다.
      parameters:
        - name: concertId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 고유 ID
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dates:
                            type: array
                            items:
                              type: string
                              format: date
                            example: ["2025-12-01", "2025-12-02", "2025-12-03"]
        '404':
          $ref: '#/components/responses/NotFoundError'

  # 2. 특정 날짜 좌석 조회
  /concerts/{concertId}/dates/{date}/seats:
    get:
      summary: 특정 날짜 좌석 조회
      description: 특정 콘서트 및 날짜의 좌석 예약 현황을 조회합니다.
      parameters:
        - name: concertId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 고유 ID
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          description: 조회할 날짜 (YYYY-MM-DD)
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          date:
                            type: string
                            format: date
                            example: "2025-12-01"
                          seats:
                            type: array
                            items:
                              $ref: '#/components/schemas/SeatInfo'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # 3. 좌석 임시 배정 요청
  /concerts/{concertId}/reservations:
    post:
      summary: 좌석 임시 배정 요청
      description: 특정 좌석을 5분간 임시 점유(held)합니다. (인증 필요)
      security:
        - BearerAuth: []
      parameters:
        - name: concertId
          in: path
          required: true
          schema:
            type: string
          description: 콘서트 고유 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - date
                - seat_number
              properties:
                user_id:
                  type: string
                  example: "user_123"
                date:
                  type: string
                  format: date
                  example: "2025-12-22"
                seat_number:
                  type: integer
                  example: 10
      responses:
        '201':
          description: 임시 배정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reservation_id:
                            type: string
                            example: "reservation_7654"
                          status:
                            type: string
                            enum: [held]
                            example: "held"
                          date:
                            type: string
                            format: date
                            example: "2025-12-22"
                          seat_number:
                            type: integer
                            example: 10
                          hold_expire_time:
                            type: string
                            format: date-time
                            example: "2025-12-01T09:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  # 4-1, 4-2. 포인트 조회 및 충전
  /users/{userId}/points:
    get:
      summary: 포인트 조회
      description: 사용자의 현재 포인트 잔액을 조회합니다. (인증 필요)
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          points:
                            type: integer
                            example: 130000
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: 포인트 충전
      description: 사용자의 지갑에 포인트를 충전합니다. (인증 필요)
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                  example: 100000
      responses:
        '200':
          description: 충전 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          charged_amount:
                            type: integer
                            example: 100000
                          total_points:
                            type: integer
                            example: 130000
        '400':
          $ref: '#/components/responses/BadRequestError'

  # 5. 결제 요청
  /reservations/{reservationId}/payments:
    post:
      summary: 결제 요청
      description: 임시 배정된 좌석에 대한 결제를 진행하고 예약을 확정합니다. (인증 필요)
      security:
        - BearerAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  example: 90000
      responses:
        '201':
          description: 결제 성공 (예약 확정)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment_id:
                            type: string
                            example: "payment_1234"
                          amount:
                            type: integer
                            example: 90000
                          status:
                            type: string
                            enum: [completed]
                            example: "completed"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '410':
          $ref: '#/components/responses/GoneError'

  # 6-1, 6-2. 대기열 토큰 발급 및 대기번호 조회
  /queues:
    post:
      summary: 대기열 토큰 발급
      description: 대기열 진입을 위한 토큰을 발급받습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  example: "user_123"
      responses:
        '201':
          description: 발급 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QueueStatus'
        '409':
          $ref: '#/components/responses/ConflictError'

  /queues/{userId}:
    get:
      summary: 대기번호 조회
      description: 사용자의 현재 대기열 순번을 확인합니다.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QueueStatus'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  # 인증 방식 정의
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      # [교정 파트] 큰따옴표 내부에 콜론(:) 문자가 들어와 오작동하던 설정을 안전한 단일 문자열로 변경
      description: JWT 인증 헤더 - Authorization 헤더에 Bearer 토큰을 넣어주세요.

  # 데이터 공통 규격 정의
  schemas:
    # 공통 성공 규격 (Envelope Pattern)
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    # 공통 에러 규격
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "에러 상세 메시지 설명"

    # 좌석 정보 객체
    SeatInfo:
      type: object
      properties:
        seat_number:
          type: integer
          example: 1
        status:
          type: string
          enum: [available, held, sold]
          example: "available"

    # 대기열 정보 객체
    QueueStatus:
      type: object
      properties:
        user_id:
          type: string
          example: "user_123"
        waiting_order:
          type: integer
          example: 33

  # 공통 에러 응답 재사용 정의
  responses:
    BadRequestError:
      description: 잘못된 요청 파라미터 또는 충전/결제 유효성 검사 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: 리소스 충돌 (이미 선점된 좌석 또는 이미 대기열에 진입한 상태)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GoneError:
      description: 예약 만료 등 리소스가 유효하지 않게 된 상태
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'